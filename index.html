<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvenUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8FA;--surface:#FFFFFF;--ink:#0F1B2E;--muted:#55637A;--border:#E4E7EC;--accent:#2952E3;--soft:#E6EEFD}
@media (prefers-color-scheme:dark){:root{--bg:#0C1526;--surface:#16233F;--ink:#EAF0FB;--muted:#93A2BE;--border:#24304A;--accent:#5B9CF6;--soft:#1D2C4D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Public Sans',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1,h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.2}
h1{font-size:30px;margin:8px 0 4px}
h2{font-size:20px;margin:32px 0 8px}
p,li{color:var(--ink)}
em{color:var(--muted);font-style:normal;font-size:14px}
a{color:var(--accent)}
nav a{font-weight:600;text-decoration:none;margin-right:16px}
.wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--soft)}
tr:last-child td{border-bottom:0}
</style></head>
<body><main><nav><a href="gizlilik/">Gizlilik Politikası</a><a href="kosullar/">Kullanım Koşulları</a></nav>
<h1>EvenUp</h1><p>Arkadaş gruplarıyla ortak harcamaları bölüşmenin kolay yolu.</p><p>Destek: <a href="mailto:evenup.kvkk@gmail.com">evenup.kvkk@gmail.com</a></p>
</main></body></html>
